<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students</title>
  <style>
    
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  header {
    background-color: #4CAF50;
    color: white;
    padding: 1rem;
    text-align: center;
  }
  
  nav a {
    margin: 0 1rem;
    color: white;
    text-decoration: none;
  }
  
  main {
    padding: 2rem;
  }
  
  form {
    margin-bottom: 2rem;
  }
  
  form label {
    margin-right: 0.5rem;
  }
  
  form input {
    margin-right: 1rem;
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
  }
  
  table th, table td {
    border: 1px solid #ddd;
    padding: 8px;
  }
  
  table th {
    background-color: #4CAF50;
    color: white;
  }
  
  footer {
    text-align: center;
    padding: 1rem;
    background-color: #f1f1f1;
  }
  
    label {

font-size: 14px;
font-weight: 600;
margin-bottom: 10px;
display: block;
color: #180202;
}
</style>
</head>
<body>
  <header>
    <h1>Manage Students</h1>
    <nav>
      <a href="admin-dashboard.html">Back to Dashboard</a>
    </nav>
  </header>
  <main>
    <form id="add-student-form">
      <h2>Add Student</h2>
      <label for="student-id">Student ID:</label>
      <input type="text" id="student-id" name="student-id" required>
      <label for="student-name"> first Name:</label>
      <input type="text" id="student-name" name="student-name" required>
      <label for="student-name"> last Name:</label>
      <input type="text" id="student-name" name="student-name" required>
      <label for="password"> password:</label>
      <input type="text" id="password" name="password" required>
      <label for="student-email">Email:</label>
      <input type="email" id="student-email" name="student-email" required>
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="1234567890" required maxlength="11">

      <label for="birth_date">Birth Date</label>
      <input type="date" id="birth_date" name="birth_date" required>
      <button type="submit">Add Student</button>
    </form>
    <h2>Current Students</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>first name</th>
          <th>last name</th>
          <th>password</th>
          <th>birth date</th>
          <th>phone</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody id="student-list">
        <!-- Dynamic student rows will appear here -->
      </tbody>
    </table>
  </main>
</body>
</html>
