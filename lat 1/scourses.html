<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses, Grades, and Pass/Fail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        table {
            width: 80%;
            margin: 30px 0;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .pass {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        .fail {
            background-color: #f44336;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <caption>Course</caption>
        <thead>
            <tr>
                
                <th>Student Code</th> 
                <th>Grade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                
                <td> <a href="student-dashboard.html">1453</a></td>
                <td>100</td>
                <td class="pass">Pass</td>
            </tr>
            <tr>
                <td> <a href="student-dashboard.html">123345</a></td>
                <td>40</td>
                <td class="fail">Fail</td>
            </tr>
            <tr>
                <td> <a href="student-dashboard.html">1243</a></td>
                <td>51</td>
                <td class="pass">Pass</td>
            </tr>
            <tr>
                <td> <a href="student-dashboard.html">6123</a></td>
                <td>60</td>
                <td class="pass">Pass</td>
            </tr>
            <tr>
                <td> <a href="student-dashboard.html">1543623</a></td>
                <td>55</td>
                <td class="pass">Pass</td>
            </tr>
            <tr>
                <td> <a href="student-dashboard.html">123243</a></td>
                <td>32</td>
                <td class="fail">Fail</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
