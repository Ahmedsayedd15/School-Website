<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body styling */
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: #0a85c7;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    /* Header styling */
    header h1 {
      color: #090106;
      font-size: 36px;
      margin-bottom: 30px;
    }

    /* Main form container styling */
    main {
      background-color: #0e0101;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    /* Label styling */
    label {
      font-size: 14px;
      font-weight: bold;
      color: #f0e6e6;
      margin-bottom: 10px;
      display: block;
      text-align: left;
    }

    /* Input fields styling */
    input[type="id"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #290e0e;
      border-radius: 6px;
      font-size: 16px;
      color: #333;
    }

    /* Focus effect for input fields */
    input:focus, 
    select:focus {
      border-color: #158b1b;
      outline: none;
    }

    /* Button styling */
    button {
      width: 100%;
      padding: 12px;
      background-color: #0a85c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    /* Button hover effect */
    button:hover {
      background-color:#0a85c7;
    }

    /* Link styling */
    p {
      margin-top: 20px;
    }

    a {
      color:#0a85c7;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Responsive styling for smaller screens */
    @media (max-width: 480px) {
      header h1 {
        font-size: 28px;
      }

      main {
        padding: 20px;
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Login to School System</h1>
  </header>
  <main>
    <form id="login-form">
      <label for="id">id:</label>
      <input type="id" id="id" name="id" placeholder="Enter your id" required>
      
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <label for="role">Login as:</label>
      <select id="role" name="role" required>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
