<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Grades</title>

  <style>
    
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  header {
    background-color: #4CAF50;
    color: white;
    padding: 1rem;
    text-align: center;
  }
  
  nav a {
    margin: 0 1rem;
    color: white;
    text-decoration: none;
  }
  
  main {
    padding: 2rem;
  }
  
  form {
    margin-bottom: 2rem;
  }
  
  form label {
    margin-right: 0.5rem;
  }
  
  form input {
    margin-right: 1rem;
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
  }
  
  table th, table td {
    border: 1px solid #ddd;
    padding: 8px;
  }
  
  table th {
    background-color: #4CAF50;
    color: white;
  }
  
  footer {
    text-align: center;
    padding: 1rem;
    background-color: #f1f1f1;
  }
  
            label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
      color: #180202;
    }
  </style>
</head>
<body>
  <header>
    <h1>Manage Grades</h1>
    <nav>
      <a href="admin-dashboard.html">Back to Dashboard</a>
    </nav>
  </header>
  <main>
    <form id="add-grade-form">
      <h2>Add Grade</h2>
      <label for="student-id">Student ID:</label>
      <input type="text" id="student-id" name="student-id" required>
      <label for="course-id">Course ID:</label>
      <input type="text" id="course-id" name="course-id" required>
      <label for="grade">Grade:</label>
      <input type="text" id="grade" name="grade" required>
      <button type="submit">Add Grade</button>
    </form>
    <h2>Student Grades</h2>
    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Course ID</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody id="grade-list">
        <!-- Dynamic grade rows will appear here -->
      </tbody>
    </table>
  </main>
</body>
</html>
