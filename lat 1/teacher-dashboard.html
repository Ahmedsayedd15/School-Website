<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
    font-family: 'Helvetica Neue', sans-serif;
    background-color: #f0f4f8;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;  /* Centers vertically and horizontally */
    height: 100vh;
    padding: 20px;
    margin: 0;  /* Removes default body margin */
}

        /* Header styling */
        header {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #16055f;
            color: white;
            padding: 20px 0;
            text-align: center;
            z-index: 1000;
        }

        header nav a {
            color: rgb(255, 255, 255);
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        header nav a:hover {
            color: #ffd700;
        }

        /* Dashboard container */
        .dashboard-container {
    background-color: #ffffff;
    width: 100%;
    max-width: 800px;
    padding: 40px;
    border-radius: 10px;
    text-align: center;
}

        /* Title */
        h2 {
            color: #2b08f1;
            font-size: 35px;
            margin-bottom: 20px;
        }

        /* Profile details */
        .profile p {
            font-size: 17px;
            margin-bottom: 5px;
            color: #555;
        }

        /* Button styling */
        .button a {
            background-color: #2b08f1;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 6px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        /* Hover effect for buttons */
        .button a:hover {
            background-color: #1a06d1;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 600px) {
            .dashboard-container {
                padding: 20px;
            }
            h2 {
                font-size: 28px;
            }
            .profile p {
                font-size: 14px;
            }
            .button a {
                font-size: 16px;
                padding: 8px 16px;
            }
        } 
 </style> 
</head>
<body>
    <header>
  <nav>
    <a href="scourses.html"> Courses </a>
  </nav>
    </header>
    <div class="dashboard-container">
        <h2>Welcome Teacher</h2>

            <p>Password: *******8</p>
        </div>
    </div>
</body>
</html>
