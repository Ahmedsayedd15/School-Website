<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Courses</title>
  <style>
    
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  header {
    background-color: #4CAF50;
    color: white;
    padding: 1rem;
    text-align: center;
  }
  
  nav a {
    margin: 0 1rem;
    color: white;
    text-decoration: none;
  }
  
  main {
    padding: 2rem;
  }
  
  form {
    margin-bottom: 2rem;
  }
  
  form label {
    margin-right: 0.5rem;
  }
  
  form input {
    margin-right: 1rem;
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
  }
  
  table th, table td {
    border: 1px solid #ddd;
    padding: 8px;
  }
  
  table th {
    background-color: #4CAF50;
    color: white;
  }
  
  footer {
    text-align: center;
    padding: 1rem;
    background-color: #f1f1f1;
  }
  
        label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
      color: #180202;
    }
  </style>
</head>
<body>
  <header>
    <h1>Manage Courses</h1>
    <nav>
      <a href="admin-dashboard.html">Back to Dashboard</a>
    </nav>
  </header>
  <main>
    <form id="add-course-form">
      <h2>Add Course</h2>
      <label for="course-id">Course ID:</label>
      <input type="text" id="course-id" name="course-id" required>
      <label for="course-name">Course Name:</label>
      <input type="text" id="course-name" name="course-name" required>
      <label for="course-teacher">Teacher:</label>
      <input type="text" id="course-teacher" name="course-teacher" required>
      <button type="submit">Add Course</button>
    </form>
    <h2>Current Courses</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Teacher</th>
        </tr>
      </thead>
      <tbody id="course-list">
        <!-- Dynamic course rows will appear here -->
      </tbody>
    </table>
  </main>
</body>
</html>
