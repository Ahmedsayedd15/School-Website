<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
   
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #121416;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #0a85c7;
      text-align: center;
      padding: 20px;
    }

  
    header h1 {
      color: #090106;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 30px;
    }

  
    main {
      background-color: #18191e;
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 450px;

    }

    
    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
      color: #ddd;
    }

  
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="password"],
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 2px solid #444;
      border-radius: 10px;
      font-size: 16px;
      color: #fff;
      background-color: #333;

    }
    button:hover {
      background-color: #3d6572;

      
    }
    
    /* Button styling */
    button {
      width: 100%;
      padding: 15px;
      background-color: #00d4d8;
      border-radius: 10px;
      font-size: 18px; 
   
    }
  </style>
</head>
<body>
  <header>
    <h1>Sign Up for School System</h1>
  </header>
  <main>
    <form id="signup-form">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="first_name" placeholder="Enter first name" required>

      <label for="last_name">Last Name</label>
      <input type="text" id="last_name" name="last_name" placeholder="Enter last name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="1234567890" required maxlength="11">

      <label for="birth_date">Birth Date</label>
      <input type="date" id="birth_date" name="birth_date" required>

      <label for="id">ID</label>
      <input type="text" id="id" name="id" placeholder="Enter ID" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter Password" minlength="8" maxlength="16" required>

      <label for="role">Sign Up As</label>
      <select id="role" name="role" required>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>

      <button type="submit">Sign Up</button>
    </form>
  </main>
  <script src="script.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', function(event) {
      event.preventDefault(); 
      window.location.href = "login (2).html";  
    });
  </script>
</body>
</html>
